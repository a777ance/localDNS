<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>localDNS (leader) · repo explorer with Claude</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--ink:#1f1d1a;--mute:#7a756d;--line:#e4e0d8;--accent:#c4552d;--accent-ink:#fff;--code:#f3f1ec;--user:#efe9df}
@media (prefers-color-scheme:dark){:root{--bg:#1a1917;--panel:#232220;--ink:#ece8e1;--mute:#9b958b;--line:#35322e;--accent:#e0805a;--accent-ink:#1a1917;--code:#2a2826;--user:#2f2c28}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
header b{font-size:15px}
header span{color:var(--mute);font-size:12px}
nav{display:none;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:9px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:inherit;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr 380px}
section{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
section:last-child{border-right:0}
.pad{padding:8px 10px}
input[type=search],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.scroll{flex:1;min-height:0;overflow:auto}
.row{display:flex;gap:6px;align-items:center;padding:3px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover{background:var(--code)}
.row.sel{background:var(--user)}
.row .ic{color:var(--mute);width:12px;flex:none;font-size:11px}
.fh{padding:8px 12px;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute);word-break:break-all}
pre.code{margin:0;padding:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:4}
.empty{padding:24px;color:var(--mute)}
.btn{width:100%;font:inherit;font-weight:600;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.res{padding:12px}
.res h3{margin:0 0 4px;font-size:14px}
.res .st{color:var(--mute);font-size:12px;margin-bottom:10px;white-space:pre-wrap}
.res details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg)}
.res summary{padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.res summary .b{font:600 11px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:4px}
.b.ok{background:#2e7d4f;color:#fff}.b.bad{background:#b3261e;color:#fff}.b.skip{background:var(--line);color:var(--mute)}
.res .sum{padding:7px 10px;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg)}
.res .sum .b,.res summary .b{flex:none}
.steps{border:1px solid var(--line);border-radius:6px;padding:6px;max-height:360px;overflow:auto;font:11px/1.5 ui-monospace,Menlo,monospace;background:var(--panel)}.st1{white-space:pre-wrap;word-break:break-word}.sk{display:inline-block;min-width:52px;font-weight:600}.sx{color:var(--mute)}.sm{color:var(--mute);margin-left:6px;font-size:10px}
.sp{margin:6px 0;background:var(--bg);border-radius:6px}.sp>summary{padding:6px 8px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.sp .kd{font:600 11px ui-monospace,Menlo,monospace;text-transform:uppercase}.sp .du{margin-left:auto;color:var(--mute);font-size:11px}
.sp .sb{padding:0 8px 6px}.sp .tk{font-size:11px;color:var(--mute);margin-top:6px}.sp .sb pre{border:1px solid var(--line);border-radius:6px;max-height:260px}
.res pre{margin:0;padding:8px 10px;border-top:1px solid var(--line);font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
img.pv{max-width:100%;padding:12px}
.msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.m.u{background:var(--user);align-self:flex-end;max-width:90%}
.m.a{background:var(--code)}
.m code{background:var(--bg);padding:1px 4px;border-radius:4px;font:12px ui-monospace,Menlo,monospace}
.m pre{background:var(--bg);padding:8px;border-radius:6px;overflow:auto;margin:6px 0;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre}
.m.note{color:var(--mute);font-size:12px;background:none;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.chips button{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;cursor:pointer}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.send textarea{resize:none;height:42px}
.send button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:0 14px;font:inherit;font-weight:600;cursor:pointer}
.send button:disabled{opacity:.5;cursor:default}
@media (max-width:900px){
  nav{display:flex}
  main{grid-template-columns:1fr}
  main>section{display:none;border-right:0}
  main[data-tab=files]>#files,main[data-tab=view]>#view,main[data-tab=chat]>#chat{display:flex}
}
</style>
</head>
<body>
<header><b id="title">localDNS</b><span id="meta">loading…</span><span id="hs" style="margin-left:auto">harness: not started</span><button id="mailb" class="btn" style="width:auto;padding:2px 9px;font-weight:500">Mail</button><button id="trc" class="btn" style="width:auto;padding:2px 9px;font-weight:500">Full trace</button><button id="dbg" class="btn" style="width:auto;padding:2px 9px;font-weight:500">Debug</button></header>
<nav id="nav"><button data-t="files" class="on">Files</button><button data-t="view">Viewer</button><button data-t="chat">Claude</button></nav>
<main id="main" data-tab="files">
  <section id="files">
    <div class="pad"><input type="search" id="q" placeholder="Filter files…" autocomplete="off"></div>
    <div class="pad" style="padding-top:0"><button id="runchecks" class="btn">Run tools/ checks</button></div>
    <div class="scroll" id="tree"></div>
  </section>
  <section id="view">
    <div class="fh" id="fh">No file selected</div>
    <div class="scroll" id="fv"><div class="empty">Pick a file from the tree, or ask Claude about the repo.</div></div>
  </section>
  <section id="chat">
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <div class="send"><textarea id="in" placeholder="Ask about this repo…"></textarea><button id="go">Ask</button></div>
  </section>
</main>
<script id="hooks-js">

    };

  /* ------------------------------------------------------------ Stop: decide-act.py */
  var HEDGES = ["should work", "probably works", "probably work", "may have worked", "might have worked", "should be fine"];
  var RE_DECIDE = /^[^\p{L}\p{N}_]*(?:Decide[ds]?\b|D · )[^\n]*$/mu; // DEBT-014: the letter form counts too

<script type="text/plain" id="shim-src">"""browser_shim: lets the repo's tools/ scripts run where there are no real processes, no git and no bash.

Nothing here makes a check pass that would not pass: whatever cannot be emulated fails, raises, or is reported SKIP.

  * python subprocesses (sys.executable / python3 <script> ...) run in-process, with argv, stdin, stdout, cwd and env isolated.
  * git is answered read-only from the bundled snapshot (a clean checkout of one commit). Network git (ls-remote, push, fetch),
    anything that mutates, and any directory that is not the snapshot root answer like real git would when it cannot comply.
  * bash and every other program: FileNotFoundError, as on a machine without it.
  * long-running Popen children (servers, watchers): unsupported, OSError.
  * signal.alarm timeouts are no-ops here, so a runaway check is not interrupted.
"""
import sys, os, io, runpy, traceback, signal, types, re, json, shlex, tempfile

ROOT = "/repo"
HEAD = "0" * 40
BRANCH = "leader"
_PYNAMES = {"python", "python3"}

PIPE, STDOUT, DEVNULL = -1, -2, -3


class TimeoutExpired(Exception):
    def __init__(self, cmd, timeout, output=None, stderr=None):

        self.cmd, self.timeout, self.output, self.stderr = cmd, timeout, output, stderr


class CalledProcessError(Exception):
    def __init__(self, returncode, cmd, output=None, stderr=None):
        super().__init__("Command %r returned non-zero exit status %s." % (cmd, returncode))
        self.returncode, self.cmd, self.output, self.stdout, self.stderr = returncode, cmd, output, output, stderr


class CompletedProcess:
    def __init__(self, args, returncode, stdout=None, stderr=None):
        self.args, self.returncode, self.stdout, self.stderr = args, returncode, stdout, stderr

    def check_returncode(self):

            raise CalledProcessError(self.returncode, self.args, self.stdout, self.stderr)


def _is_py(c0):
    return c0 in _PYNAMES or (bool(sys.executable) and c0 == sys.executable) or os.path.basename(c0).startswith("python")


def _in_repo(cwd):
    c = os.path.realpath(cwd or os.getcwd())
    r = os.path.realpath(ROOT)
    return c == r or c.startswith(r + os.sep)


def _git(args, cwd):
    """Return (returncode, stdout, stderr) the way git would answer for the bundled clean snapshot."""
    args = list(args)
    while args and args[0] == "-C" and len(args) >= 2:
        cwd = os.path.join(cwd or os.getcwd(), args[1])
        args = args[2:]
    if not _in_repo(cwd):
        return 128, "", "fatal: not a git repository (or any of the parent directories): .git\n"
    if not args:
        return 1, "", "usage: git <command>\n"
    a = args
    if a[:2] == ["status", "--porcelain"] and len(a) == 2:
        return 0, "", ""
    if a == ["rev-parse", "HEAD"]:
        return 0, HEAD + "\n", ""
    if a == ["rev-parse", "--abbrev-ref", "HEAD"]:
        return 0, BRANCH + "\n", ""
    if a == ["rev-parse", "--short", "HEAD"]:
        return 0, HEAD[:7] + "\n", ""
    if a == ["rev-parse", "--show-toplevel"]:
        return 0, ROOT + "\n", ""
    if a[0] == "diff" and "--name-only" in a and len(a) == 3 and a[2].count("...") == 1:
        left, right = a[2].split("...")
        known = {"origin/" + BRANCH, BRANCH, "HEAD"}
        if left in known and right in known:
            return 0, "", ""
        return 128, "", "fatal: bad revision '%s' (only the bundled branch is available here)\n" % a[2]
    if a == ["ls-files"]:
        rels = []
        for d, ds, fs in os.walk(ROOT):
            for f in fs:
                rels.append(os.path.relpath(os.path.join(d, f), ROOT))
        return 0, "\n".join(sorted(rels)) + "\n", ""
    if a[0] in ("ls-remote", "push", "fetch", "pull", "clone"):
        return 128, "", "fatal: unable to access remote: no network from the browser\n"
    return 128, "", "git: '%s' is not available in the browser snapshot\n" % " ".join(a)


def _run_py(args, input_text, cwd, env):
    """Run `python <script> ...` in-process; returns (returncode, stdout, stderr)."""
    args = list(args)
    while args and args[0].startswith("-"):
        flag = args.pop(0)
        if flag in ("-c", "-m"):
            raise OSError("python %s is not supported in the browser" % flag)
    if not args:
        raise OSError("interactive python is not supported in the browser")

    out, err = io.StringIO(), io.StringIO()
    code = 0
    try:
        if cwd:
            os.chdir(cwd)
        if env is not None:
            os.environ.clear()
            os.environ.update(env)
        sys.argv = [script] + rest
        sys.stdin = io.StringIO(input_text or "")
        sys.stdout, sys.stderr = out, err
        sys.path.insert(0, os.path.dirname(os.path.abspath(script)))
        try:
            runpy.run_path(script, run_name="__main__")
        except SystemExit as e:

        os.environ.update(saved[5])

            f = getattr(sys.modules.get(name), "__file__", None) or ""

def run(args, *, input=None, capture_output=False, stdout=None, stderr=None, text=None, universal_newlines=None,
        cwd=None, env=None, timeout=None, check=False, encoding=None, errors=None, shell=False, stdin=None, **kw):
    if isinstance(args, (str, bytes)):
        args = shlex.split(args.decode() if isinstance(args, bytes) else args)
    args = [os.fspath(a) for a in args]
    if not args:
        raise ValueError("empty command")
    cwd = os.fspath(cwd) if cwd is not None else None
    want_text = bool(text or universal_newlines or encoding)
    if isinstance(input, bytes):
        input = input.decode()
    c0 = args[0]
    if _is_py(c0):
        rc, o, e = _run_py(args[1:], input, cwd, env)
    elif c0 == "git":
        rc, o, e = _git(args[1:], cwd)

        raise FileNotFoundError(2, "No such file or directory: %r (not available in the browser)" % c0)

    cap_err = capture_output or stderr == PIPE
    if stderr == STDOUT:
        o, e, cap_err = o + e, "", False
        cap_out = cap_out or stdout == PIPE
    if not cap_out:
        sys.stdout.write(o)
        o = None
    if not cap_err and e:
        sys.stderr.write(e)
    if not cap_err:
        e = None
    if not want_text:
        o = o.encode() if o is not None else None
        e = e.encode() if e is not None else None
    cp = CompletedProcess(args, rc, o, e)
    if check and rc:
        raise CalledProcessError(rc, args, o, e)

def call(args, **kw):
    return run(args, **kw).returncode


def check_call(args, **kw):
    kw["check"] = True
    return run(args, **kw).returncode


def check_output(args, **kw):
    kw["check"] = True
    kw["stdout"] = PIPE
    return run(args, **kw).stdout


class Popen:

def _make_subprocess():
    m = types.ModuleType("subprocess")
    for k, v in dict(BROWSER_SHIM=True, PIPE=PIPE, STDOUT=STDOUT, DEVNULL=DEVNULL, TimeoutExpired=TimeoutExpired,
                     CalledProcessError=CalledProcessError, CompletedProcess=CompletedProcess, run=run, call=call,
                     check_call=check_call, check_output=check_output, Popen=Popen, SubprocessError=Exception).items():

def install(root, head, branch):
    global ROOT, HEAD, BRANCH
    ROOT, HEAD, BRANCH = root, head, branch
    sys.modules["subprocess"] = _make_subprocess()
    if not hasattr(signal, "SIGALRM"):

        except (OSError, ValueError, RuntimeError):

def run_script(path):
    """Run one tools/ script the way `python3 <path>` would from the repo root: (exit code, combined output)."""
    rc, o, e = _run_py([path], None, ROOT, None)
    return rc, o + e


# ------------------------------------------------------------------ check-all.sh, ported
_REQUIRED = ["CLAUDE.md", ".claude/cardinal-map.json", ".claude/hooks/cardinal.py", ".claude/hooks/decide-act.py",
             ".claude/hooks/gate.sh", "tools/matrix.py", "tools/racetrack.py", "docs/ai-cto/fleet/racetrack/RULES.md"]
_STEP_NAMES = ["clean working tree", "leader matches origin/leader", "orient.probe", "decide.probe", "observe.probe push",
               "check-cardinal", "check-superfleet", "check-decisions", "check-docs", "check-provenance", "check-registers",
               "racetrack arena self-test", "no agent running (agent ledger)", "check-matrix (end to end)",
               "check-stop-hook", "check-doctrine", "check-statements"]


def check_all(quick=False):
    steps = []

    def add(group, name, status, detail=""):
        steps.append({"group": group, "name": name, "status": status, "detail": detail})

    def py(group, name, *argv):
        try:
            r = run(["python3", *argv], cwd=ROOT, capture_output=True, text=True)
            o = ((r.stdout or "") + (r.stderr or "")).strip()
            if r.returncode == 0:
                add(group, name, "pass")
            else:
                add(group, name, "fail", "exit %d\n%s" % (r.returncode, "\n".join(o.splitlines()[-6:])))
        except Exception as e:  # a missing capability is a failure to verify, never a pass
            add(group, name, "fail", "%s: %s" % (type(e).__name__, e))

    g = "repo state"
    rc, o, _ = _git(["status", "--porcelain"], ROOT)
    add(g, "clean working tree", "pass" if rc == 0 and not o.strip() else "fail",
        "the bundled snapshot is a clean checkout of %s" % HEAD[:7])
    add(g, "leader matches origin/leader", "skip", "needs the network (git ls-remote); not checkable from a browser")
    g = "required files"
    for f in _REQUIRED:
        add(g, "present " + f, "pass" if os.path.exists(os.path.join(ROOT, f)) else "fail")
    g = "matrix probes (lane 0)"
    py(g, "orient.probe", "tools/matrix.py", "orient.probe")
    py(g, "decide.probe", "tools/matrix.py", "decide.probe")
    py(g, "observe.probe push", "tools/matrix.py", "observe.probe", "push")
    g = "static gates"
    py(g, "check-cardinal", "tools/check-cardinal.py")
    py(g, "check-superfleet", "tools/check-superfleet.py")
    py(g, "check-decisions", "tools/check-decisions.py")
    py(g, "check-docs", "tools/check-docs.py")
    py(g, "check-provenance", "tools/check-provenance.py")
    py(g, "check-registers", "tools/check-registers.py")
    py(g, "racetrack arena self-test", "tools/racetrack.py", "--selftest")
    py(g, "no agent running (agent ledger)", "tools/matrix.py", "observe.agents", "check")
    if not quick:
        g = "slower gates"
        add(g, "check-matrix (end to end)", "skip", "it kills and caps real child processes to prove its limits; run in-process it would kill the host, so it needs a real OS")
        py(g, "check-stop-hook", "tools/check-stop-hook.py")
        py(g, "check-doctrine", "tools/check-doctrine.py")
        py(g, "check-statements", "tools/check-statements.py")

    try:
        src = open(os.path.join(ROOT, "tools/check-all.sh"), encoding="utf-8").read()
        sh = set(re.findall(r'step "([^"]+)"', src))

                sorted(sh - set(_STEP_NAMES)), sorted(set(_STEP_NAMES) - sh))
    except OSError as e:
        drift = "could not read tools/check-all.sh to compare: %s" % e
    n = lambda s: sum(1 for x in steps if x["status"] == s)
    return json.dumps({"steps": steps, "passed": n("pass"), "failed": n("fail"), "skipped": n("skip"), "drift": drift})


# ------------------------------------------------------------------ harness hooks, driven by .claude/settings.json
def run_hooks(event, payload_json, matcher_value="", extra_env_json="{}"):
    """Run every hook settings.json registers for `event` whose matcher fits `matcher_value`.

    python3 <script>   runs in-process. A command that ends in .sh runs its Python port from tools/browser/<name>.py
    when there is one; with no port it is reported as status "no_port" (never as passed). Returns a JSON list of
    {command, ran, status, code, stdout, stderr}."""
    results = []
    try:
        cfg = json.load(open(os.path.join(ROOT, ".claude/settings.json"), encoding="utf-8"))
    except (OSError, ValueError) as e:
        return json.dumps([{"command": ".claude/settings.json", "ran": "", "status": "error", "code": 1,
                            "stdout": "", "stderr": "cannot read settings: %s" % e}])
    extra = json.loads(extra_env_json or "{}")
    for grp in (cfg.get("hooks") or {}).get(event, []):
        m = grp.get("matcher")
        if m and not re.fullmatch(m, matcher_value or ""):
            continue
        for h in grp.get("hooks", []):
            if h.get("type") != "command":
                continue
            cmd = h.get("command", "")
            try:
                argv = shlex.split(cmd.replace("$CLAUDE_PROJECT_DIR", ROOT))
            except ValueError as e:
                results.append({"command": cmd, "ran": "", "status": "error", "code": 1, "stdout": "", "stderr": str(e)})
                continue
            if argv and _is_py(argv[0]):
                argv = argv[1:]
            script = argv[0] if argv else ""
            status = "ran"
            if script.endswith(".sh"):
                port = os.path.join(ROOT, "tools/browser", os.path.splitext(os.path.basename(script))[0] + ".py")
                if os.path.isfile(port):
                    script = port
                else:
                    results.append({"command": cmd, "ran": "", "status": "no_port", "code": None, "stdout": "",
                                    "stderr": "no Python port in tools/browser/ for %s" % os.path.basename(script)})
                    continue
            env = dict(os.environ)
            env["CLAUDE_PROJECT_DIR"] = ROOT
            env.update(extra)
            try:
                rc, o, e = _run_py([script] + argv[1:], payload_json, ROOT, env)
            except Exception as ex:
                rc, o, e = 1, "", "%s: %s" % (type(ex).__name__, ex)
                status = "error"
            results.append({"command": cmd, "ran": os.path.relpath(script, ROOT) if script.startswith(ROOT) else script,
                            "status": status, "code": rc, "stdout": o, "stderr": e})
    return json.dumps(results)

    var c=kids[s.id]||[],stat=s.status==="ok"?"":" · <b style='color:"+(s.status==="running"?"var(--mute)":"#b3261e")+"'>"+esc(s.status)+"</b>";
    var meta=Object.keys(s.meta||{}).length?"<div class='tk'>meta</div><pre>"+esc(pretty(s.meta))+"</pre>":"";
    var err=s.error?"<div class='tk'>error</div><pre>"+esc(s.error)+"</pre>":"";
    var sumline=s.meta&&s.meta.summary_line?"<div class='tk' style='width:100%;margin:2px 0 0'>"+esc(s.meta.summary_line)+"</div>":"";
    return "<details class='sp' style='margin-left:"+(depth?10:0)+"px;border-left:3px solid "+(KCOL[s.kind]||"#999")+"'"+(depth<1?" open":"")+"><summary><span class='kd' style='color:"+(KCOL[s.kind]||"#999")+"'>"+s.kind+"</span> "+esc(s.name)+"<span class='du'>"+dur(s)+stat+"</span>"+sumline+"</summary>"+
      "<div class='sb'><div class='tk'>started "+esc(s.wall.slice(11,23))+" · span "+s.id+(s.parent?" · parent "+s.parent:"")+"</div>"+meta+err+
      stepsHtml(s)+"<div class='tk'>input</div><pre>"+esc(pretty(s.input))+"</pre><div class='tk'>output</div><pre>"+esc(pretty(s.output))+"</pre></div>"+
      c.map(function(k){return node(k,depth+1)}).join("")+"</details>";
  }
  v.innerHTML="<div class='res'><h3>Full trace</h3><div class='st'>Everything this page sent to and got back from Claude, every tool call the model made, and every hook run. Inside each hook: the settings.json entry that started it, each function it called (named after the Python original), arguments and return values, each repo file it read, wrote or checked, and each Briefing rule with pass or FIRED. All with timings. Not visible from a page: the model's private reasoning, the server-side system prompt, and token counts (shown under meta only if the runtime returns them).</div>"+
   "<div style='display:flex;gap:8px;margin:8px 0'><button class='btn' id='tcopy'>Copy as JSON</button><button class='btn' id='tclear'>Clear</button></div>"+
   (roots.length?roots.map(function(r){return node(r,0)}).join(""):"<div class='empty'>No spans yet. Ask Claude something, then open this again.</div>")+"</div>";
  v.querySelector("#tcopy").onclick=function(){var b=this,PRE=H.preamble||"",TAG="<<PREAMBLE: the text in the top-level 'preamble' field>>";
    var t=JSON.stringify({page:location.origin,captured:new Date().toISOString(),preamble:PRE||null,spans:TRACE.map(function(s){return Object.assign({},s,{duration_ms:s.end==null?null:Math.round(s.end-s.start)})})},
      function(k,v){return (k!=="preamble"||this.spans===undefined)&&typeof v==="string"&&PRE&&v.length>=PRE.length&&v.indexOf(PRE)>=0?v.split(PRE).join(TAG):v},2);
    try{navigator.clipboard.writeText(t).then(function(){b.textContent="Copied "+Math.round(t.length/1024)+" KB"},function(){showRaw(t);b.textContent="Copy blocked: text shown below"})}catch(e){showRaw(t);b.textContent="Copy blocked: text shown below"}};
  v.querySelector("#tclear").onclick=function(){TRACE.length=0;renderTrace()};
  function showRaw(t){var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="width:100%;height:240px;font:11px ui-monospace,monospace";v.querySelector(".res").appendChild(ta);ta.focus();ta.select()}
}
$("trc").onclick=renderTrace;
try{Object.defineProperty(window,"ooda",{value:Object.freeze({trace:TRACE,hooks:function(){return HK}})})}catch(e){}

/* ---------- debug panel ---------- */
async function probe(){
  var out=[];
  try{var r=await fetch(PY_BASE+"pyodide-lock.json");out.push("fetch pyodide-lock.json: HTTP "+r.status)}catch(e){out.push("fetch pyodide-lock.json FAILED: "+(e&&e.message||e)+"  (fetch to other hosts is probably blocked by the page's connect-src policy)")}
  out.push("script tag from cdn.jsdelivr.net/pyodide: "+(typeof loadPyodide==="function"?"loaded":"not loaded yet"));
  return out;
}
$("dbg").onclick=async function(){
  var v=$("fv");$("fh").textContent="Debug";tab("view");selected=null;renderTree();
  var env=["page: "+location.origin,"in frame: "+(window.top!==window),"claude.use present: "+!!(window.claude&&window.claude.use),"sample: "+(sample?"available":"not available"),
    "WebAssembly: "+(typeof WebAssembly),"Worker: "+(typeof Worker),"user agent: "+navigator.userAgent,"hooks runtime: JavaScript ports of the repo hooks ("+(HK?"loaded":"not started")+")","python (needed only for Run checks / run_check): "+(py?"ready, "+py.version:H.py===false?"blocked by this page's policy":"not loaded"),"harness: "+(H.on?"on":H.why?"OFF ("+H.why+")":H.tried?"still loading":"not started")];
  v.innerHTML='<div class="res"><h3>Debug</h3><div class="st" id="dtxt"></div><div style="display:flex;gap:8px;margin:8px 0"><button class="btn" id="dprobe">Probe Python loading</button><button class="btn" id="dcopy">Copy</button></div></div>';
  var box=v.querySelector("#dtxt"),extra=[];
  function paint(){box.textContent=env.concat(extra,["","log:"],DLOG).join("\n")}
  paint();
  v.querySelector("#dprobe").onclick=async function(){extra=["","probe:"].concat(await probe());paint()};
  v.querySelector("#dcopy").onclick=function(){var t=box.textContent;try{navigator.clipboard.writeText(t).then(function(){this.textContent="Copied"}.bind(this),function(){this.textContent="Copy blocked: select the text instead"}.bind(this))}catch(e){this.textContent="Copy blocked: select the text instead"}};
};

/* preload Python as soon as the person is about to ask, so the first question does not pay for the download */
$("in").addEventListener("focus",function(){if(sample)ensureHarness()});
$("nav").addEventListener("click",function(e){if(e.target.dataset&&e.target.dataset.t==="chat"&&sample)ensureHarness()});

/* ---------- boot ---------- */
var REPO_T0=performance.now();dlog("loading repo.json");
var HEADS=null,HEADS_READY=fetch("heads.json").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){HEADS=d;dlog("heads.json loaded in "+Math.round(performance.now()-REPO_T0)+" ms ("+Object.keys(d.heads).length+" files)");return d}).catch(function(e){dlog("heads.json not loaded ("+e.message+"); mail turns wait for repo.json");return null});
READY=fetch("repo.json").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){dlog("repo.json loaded in "+Math.round(performance.now()-REPO_T0)+" ms ("+d.files.length+" files)");
  DATA=d;FILES=d.files;FILES.forEach(function(f){BY[f.p]=f});
  $("title").textContent=d.repo;
  $("meta").textContent="branch "+d.branch+" · "+FILES.length+" files · "+d.commit;
  renderTree();
  if(BY["README.md"]){show("README.md")}
}).catch(function(e){$("meta").textContent="Could not load repo.json ("+e.message+")";dlog("repo.json FAILED: "+e.message);throw e});

if(window.claude&&window.claude.use)MAIL.p=mailInit();
(window.claude&&window.claude.use?window.claude.use("sample"):Promise.resolve(null)).then(function(s){
  sample=s;
  if(!s){addMsg("note","Claude isn't available here. You can still browse files.");$("chips").style.display="none";$("go").disabled=true}
  else if(window.innerWidth>900)ensureHarness();
  if(s&&MAIL.ready)autoScan();
  if(s)addMsg("note","Ask anything about this repo. Claude reads the files with tools and runs inside the repo's own Claude Code hooks (status in the header; Debug lists each hook run). Your first question asks for permission.");
}).catch(function(){sample=null});
})();
