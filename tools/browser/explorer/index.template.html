<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>localDNS (leader) · repo explorer with Claude</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--ink:#1f1d1a;--mute:#7a756d;--line:#e4e0d8;--accent:#c4552d;--accent-ink:#fff;--code:#f3f1ec;--user:#efe9df}
@media (prefers-color-scheme:dark){:root{--bg:#1a1917;--panel:#232220;--ink:#ece8e1;--mute:#9b958b;--line:#35322e;--accent:#e0805a;--accent-ink:#1a1917;--code:#2a2826;--user:#2f2c28}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
header b{font-size:15px}
header span{color:var(--mute);font-size:12px}
nav{display:none;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:9px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:inherit;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr 380px}
section{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
section:last-child{border-right:0}
.pad{padding:8px 10px}
input[type=search],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.scroll{flex:1;min-height:0;overflow:auto}
.row{display:flex;gap:6px;align-items:center;padding:3px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover{background:var(--code)}
.row.sel{background:var(--user)}
.row .ic{color:var(--mute);width:12px;flex:none;font-size:11px}
.fh{padding:8px 12px;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute);word-break:break-all}
pre.code{margin:0;padding:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:4}
.empty{padding:24px;color:var(--mute)}
.btn{width:100%;font:inherit;font-weight:600;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.res{padding:12px}
.res h3{margin:0 0 4px;font-size:14px}
.res .st{color:var(--mute);font-size:12px;margin-bottom:10px;white-space:pre-wrap}
.res details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg)}
.res summary{padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.res summary .b{font:600 11px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:4px}
.b.ok{background:#2e7d4f;color:#fff}.b.bad{background:#b3261e;color:#fff}.b.skip{background:var(--line);color:var(--mute)}
.res .sum{padding:7px 10px;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg)}
.res .sum .b,.res summary .b{flex:none}
.steps{border:1px solid var(--line);border-radius:6px;padding:6px;max-height:360px;overflow:auto;font:11px/1.5 ui-monospace,Menlo,monospace;background:var(--panel)}.st1{white-space:pre-wrap;word-break:break-word}.sk{display:inline-block;min-width:52px;font-weight:600}.sx{color:var(--mute)}.sm{color:var(--mute);margin-left:6px;font-size:10px}
.sp{margin:6px 0;background:var(--bg);border-radius:6px}.sp>summary{padding:6px 8px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.sp .kd{font:600 11px ui-monospace,Menlo,monospace;text-transform:uppercase}.sp .du{margin-left:auto;color:var(--mute);font-size:11px}
.sp .sb{padding:0 8px 6px}.sp .tk{font-size:11px;color:var(--mute);margin-top:6px}.sp .sb pre{border:1px solid var(--line);border-radius:6px;max-height:260px}
.res pre{margin:0;padding:8px 10px;border-top:1px solid var(--line);font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
img.pv{max-width:100%;padding:12px}
.msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.m.u{background:var(--user);align-self:flex-end;max-width:90%}
.m.a{background:var(--code)}
.m code{background:var(--bg);padding:1px 4px;border-radius:4px;font:12px ui-monospace,Menlo,monospace}
.m pre{background:var(--bg);padding:8px;border-radius:6px;overflow:auto;margin:6px 0;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre}
.m.note{color:var(--mute);font-size:12px;background:none;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.chips button{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;cursor:pointer}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.send textarea{resize:none;height:42px}
.send button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:0 14px;font:inherit;font-weight:600;cursor:pointer}
.send button:disabled{opacity:.5;cursor:default}
@media (max-width:900px){
  nav{display:flex}
  main{grid-template-columns:1fr}
  main>section{display:none;border-right:0}
  main[data-tab=files]>#files,main[data-tab=view]>#view,main[data-tab=chat]>#chat{display:flex}
}
</style>
</head>
<body>
<header><b id="title">localDNS</b><span id="meta">loading…</span><span id="hs" style="margin-left:auto">harness: not started</span><button id="mailb" class="btn" style="width:auto;padding:2px 9px;font-weight:500">Mail</button><button id="trc" class="btn" style="width:auto;padding:2px 9px;font-weight:500">Full trace</button><button id="dbg" class="btn" style="width:auto;padding:2px 9px;font-weight:500">Debug</button></header>
<nav id="nav"><button data-t="files" class="on">Files</button><button data-t="view">Viewer</button><button data-t="chat">Claude</button></nav>
<main id="main" data-tab="files">
  <section id="files">
    <div class="pad"><input type="search" id="q" placeholder="Filter files…" autocomplete="off"></div>
    <div class="pad" style="padding-top:0"><button id="runchecks" class="btn">Run tools/ checks</button></div>
    <div class="scroll" id="tree"></div>
  </section>
  <section id="view">
    <div class="fh" id="fh">No file selected</div>
    <div class="scroll" id="fv"><div class="empty">Pick a file from the tree, or ask Claude about the repo.</div></div>
  </section>
  <section id="chat">
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <div class="send"><textarea id="in" placeholder="Ask about this repo…"></textarea><button id="go">Ask</button></div>
  </section>
</main>
<script id="hooks-js">
/*@@HOOKS_JS@@*/
</script>
<script type="text/plain" id="shim-src">#@@BROWSER_SHIM@@</script>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var DLOG=[];function dlog(m){DLOG.push(new Date().toISOString().slice(11,19)+"  "+m);if(DLOG.length>400)DLOG.shift()}
var READY=null, DATA=null, FILES=[], BY={}, openDirs={}, selected=null;
var IMG={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp"};

function tab(t){$("main").setAttribute("data-tab",t);[].forEach.call($("nav").children,function(b){b.classList.toggle("on",b.dataset.t===t)})}
$("nav").onclick=function(e){var t=e.target.dataset&&e.target.dataset.t;if(t)tab(t)};

function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function md(s){
  var parts=s.split(/```/);
  return parts.map(function(p,i){
    if(i%2){var nl=p.indexOf("\n");var body=nl>-1&&/^[\w+-]*$/.test(p.slice(0,nl))?p.slice(nl+1):p;return "<pre>"+esc(body.replace(/\n$/,""))+"</pre>"}
    return esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  }).join("");
}

/* ---------- tree ---------- */
function build(filter){
  var root={d:{},f:[]};
  FILES.forEach(function(f){
    if(filter&&f.p.toLowerCase().indexOf(filter)<0)return;
    var parts=f.p.split("/"),n=root;
    for(var i=0;i<parts.length-1;i++){n=n.d[parts[i]]||(n.d[parts[i]]={d:{},f:[]})}
    n.f.push(f);
  });
  return root;
}
function renderTree(){
  var filter=$("q").value.trim().toLowerCase(),root=build(filter),out=[];
  (function walk(n,prefix,depth){
    Object.keys(n.d).sort().forEach(function(k){
      var path=prefix+k+"/",open=filter?true:!!openDirs[path];
      out.push('<div class="row" data-dir="'+esc(path)+'" style="padding-left:'+(10+depth*14)+'px"><span class="ic">'+(open?"▼":"▶")+'</span>'+esc(k)+'</div>');
      if(open)walk(n.d[k],path,depth+1);
    });
    n.f.sort(function(a,b){return a.p<b.p?-1:1}).forEach(function(f){
      var name=f.p.split("/").pop();
      out.push('<div class="row'+(selected===f.p?" sel":"")+'" data-f="'+esc(f.p)+'" style="padding-left:'+(10+depth*14+18)+'px" title="'+esc(f.p)+'">'+esc(name)+'</div>');
    });
  })(root,"",0);
  $("tree").innerHTML=out.join("")||'<div class="empty">No matches.</div>';
}
$("tree").onclick=function(e){
  var r=e.target.closest(".row");if(!r)return;
  if(r.dataset.dir){openDirs[r.dataset.dir]=!openDirs[r.dataset.dir];renderTree()}
  else if(r.dataset.f){show(r.dataset.f);tab("view")}
};
$("q").oninput=renderTree;

var BINS=null;function loadBins(){return BINS||(BINS=fetch("bin.json").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}))}
function show(p){
  var f=BY[p];if(!f)return;selected=p;renderTree();
  var ext=(p.split(".").pop()||"").toLowerCase();
  $("fh").textContent=p+"  ·  "+f.s.toLocaleString()+" bytes";
  var v=$("fv");v.scrollTop=0;
  if(f.t!==undefined&&f.k!=="bin"){var pre=document.createElement("pre");pre.className="code";pre.textContent=f.t;v.innerHTML="";v.appendChild(pre)}
  else if(f.k==="bin"&&IMG[ext]){v.innerHTML='<div class="empty">Loading image…</div>';loadBins().then(function(B){if(selected!==p)return;if(!B[p]){v.innerHTML='<div class="empty">Image not available.</div>';return}v.innerHTML='<img class="pv" alt="">';v.firstChild.src="data:"+IMG[ext]+";base64,"+B[p]},function(e){v.innerHTML='<div class="empty">Could not load images: '+esc(e.message)+'</div>'})}
  else v.innerHTML='<div class="empty">Binary file, not shown.</div>';
}

/* ---------- Claude ---------- */
var sample=null, history=[], busy=false;
var LIM=12000;
function clip(s,n){return s.length>n?s.slice(0,n)+"\n…[truncated, "+(s.length-n)+" more chars; use read_file with offset]":s}
var TOOLS=[
 {name:"list_files",description:"List file paths in the repo (with sizes). Optionally only those under a path prefix such as '04-user-services/'. Returns up to 400 entries.",
  inputSchema:{type:"object",properties:{prefix:{type:"string"}}},
  execute:function(a){var pre=(a&&a.prefix)||"";var r=FILES.filter(function(f){return f.p.indexOf(pre)===0}).slice(0,400).map(function(f){return f.p+" ("+f.s+")"});return r.join("\n")||"(no files)"}},
 {name:"read_file",description:"Read a text file from the repo. Large files are paged: pass offset (character index) and length (default 10000, max 12000).",
  inputSchema:{type:"object",properties:{path:{type:"string"},offset:{type:"number"},length:{type:"number"}},required:["path"]},
  execute:function(a){var f=BY[a.path];if(!f)throw new Error("No such file: "+a.path);if(f.k==="bin")return "(binary file, "+f.s+" bytes)";
    var o=Math.max(0,a.offset||0),l=Math.min(LIM,a.length||10000),t=f.t.slice(o,o+l);
    return t+(o+l<f.t.length?"\n…[more: file has "+f.t.length+" chars, continue at offset "+(o+l)+"]":"")}},
 {name:"search",description:"Case-insensitive substring search across all text files. Returns matching lines as path:line: text (max 60 matches).",
  inputSchema:{type:"object",properties:{query:{type:"string"},prefix:{type:"string"}},required:["query"]},
  execute:function(a){var q=String(a.query||"").toLowerCase();if(!q)throw new Error("empty query");var res=[],pre=a.prefix||"";
    for(var i=0;i<FILES.length&&res.length<60;i++){var f=FILES[i];if(f.k==="bin"||f.t===undefined||f.p.indexOf(pre)!==0)continue;
      var ls=f.t.split("\n");for(var j=0;j<ls.length&&res.length<60;j++){if(ls[j].toLowerCase().indexOf(q)>-1)res.push(f.p+":"+(j+1)+": "+ls[j].slice(0,200))}}
    return res.join("\n")||"(no matches)"}}
];
function instructions(){
  return "You are a code-aware assistant embedded in a repo explorer for the GitHub repository "+DATA.repo+" (branch "+DATA.branch+", commit "+DATA.commit+"). "+
  "The repo is a home-network / local DNS setup (Unbound, Pi-hole, WireGuard, CAKE, monitoring) plus Claude Code config, docs, and some Python/shell scripts. "+
  "Use the list_files, read_file and search tools to ground every answer in the actual files; do not guess file contents. Cite file paths (and line numbers when you have them). "+
  "You can read and reason about code. "+(H.py===false?"You cannot run any code: Python cannot start in this view, so there is no run_check. ":"You cannot run arbitrary code, but the run_check tool runs the repo's tools/ checks in an in-browser Python runtime where git and subprocess are emulated read-only against the bundled snapshot (pass 'check-all' for the full port; check-matrix, check-bridge and check-telepathy need a real OS and are not runnable). ")+"Be concise; the viewer is narrow. Plain text and fenced code blocks only.\n\nQuestion follows.\n\n";
}
function addMsg(cls,html){var d=document.createElement("div");d.className="m "+cls;d.innerHTML=html;$("msgs").appendChild(d);$("msgs").scrollTop=1e9;return d}
function setBusy(b){busy=b;$("go").disabled=b;$("go").textContent=b?"…":"Ask"}
/* ---------- full trace: spans for every turn, model call, tool call and hook run the page can see ---------- */
var TRACE=[],TID=0,CUR={turn:null,sample:null};
function tnow(){return performance.now()}
function span(kind,name,parent,input){var s={id:++TID,parent:parent?parent.id:null,kind:kind,name:name,start:tnow(),end:null,wall:new Date().toISOString(),input:input,output:undefined,error:null,status:"running",meta:{}};TRACE.push(s);if(TRACE.length>3000)TRACE.splice(0,500);return s}
function endSpan(s,output,status,err){if(!s)return;s.end=tnow();if(output!==undefined)s.output=output;s.status=status||(err?"error":"ok");if(err)s.error=String(err&&err.message||err);}
function wrapTools(tools){
  return tools.map(function(t){return {name:t.name,description:t.description,inputSchema:t.inputSchema,execute:async function(a){
    var s=span("tool",t.name,CUR.sample,a);
    try{var r=await t.execute(a,s);endSpan(s,String(r));return r}catch(e){endSpan(s,undefined,"error",e);throw e}
  }}});
}
async function callSample(msgs,tools,bubble,label){
  var s=span("model",label||"model call",CUR.turn,{messages:msgs.map(function(m){return {role:m.role,content:m.content}}),tools:tools.map(function(t){return {name:t.name,description:t.description,inputSchema:t.inputSchema}}),options:{cache:false}});
  CUR.sample=s;var first=null,chunks=0;
  try{
    var r=await sample(msgs,{tools:wrapTools(tools),cache:false,onText:function(o){if(o&&o.text){chunks++;if(first===null)first=tnow()-s.start;bubble.innerHTML=md(o.text);$("msgs").scrollTop=1e9}}});
    var out={text:(r&&r.text)||"(no answer)",truncated:!!(r&&r.truncated)};
    s.meta={first_text_ms:first===null?null:Math.round(first),stream_updates:chunks,truncated:out.truncated};
    ["modelApplied","model","usage","stop_reason"].forEach(function(k){if(r&&r[k]!==undefined)s.meta[k]=r[k]});
    endSpan(s,out.text);return out;
  }catch(e){s.meta.code=e&&e.code;endSpan(s,e&&e.text,"error",e);throw e}
  finally{CUR.sample=null}
}
async function ask(text){
  if(busy||!text.trim())return;
  if(!sample){addMsg("note","Claude isn't available in this view.");return}
  $("chips").style.display="none";
  addMsg("u",esc(text));$("in").value="";
  var bubble=addMsg("a","<span style='color:var(--mute)'>Thinking…</span>");
  setBusy(true);
  if(!DATA){bubble.innerHTML="<span style='color:var(--mute)'>Loading the repo…</span>";try{await READY}catch(e){bubble.innerHTML="Could not load the repo: "+esc(e.message);setBusy(false);return}}
  var userMsg=text,turn=span("turn","question",null,{question:text});CUR.turn=turn;
  try{
    if(!H.on&&!H.why){
      var t1=performance.now(),WAIT=window.__HARNESS_WAIT||45000;
      var iv=setInterval(function(){bubble.innerHTML="<span style='color:var(--mute)'>Starting the harness: "+esc(H.stage||"loading Python")+" ("+Math.round((performance.now()-t1)/1000)+"s). Will answer without it after "+Math.round(WAIT/1000)+"s.</span>"},500);
      var ready=await Promise.race([ensureHarness().then(function(){return true}),new Promise(function(r){setTimeout(function(){r(false)},WAIT)})]);
      clearInterval(iv);
      if(!ready&&!H.on&&!H.why){addMsg("note","Python is still loading, so this answer has no harness. It keeps loading in the background and later answers will use it once the header says harness: on.");dlog("gave up waiting after "+WAIT+" ms; harness continues loading")}
      bubble.innerHTML="<span style='color:var(--mute)'>Thinking…</span>";
    }
    var hOn=H.on;
    var tools=hOn?harnessTools():toolList();
    var pre=hOn?H.preamble:instructions();
    var msgs=history.map(function(m){return m}).concat([{role:"user",content:text}]);
    msgs[0]={role:"user",content:pre+"\n\nQuestion follows.\n\n"+msgs[0].content};
    turn.meta.harness=hOn?"on":"off";turn.meta.tools=tools.map(function(t){return t.name});
    var r=await callSample(msgs,tools,bubble,"model call: draft"),final=r.text,note="";
    if(hOn){
      var chk=await stopHooks(userMsg,final,false,turn);
      if(chk.block){
        dlog("Stop hook BLOCKED the draft: "+chk.block.split("\n")[0].slice(0,160));
        bubble.innerHTML="<span style='color:var(--mute)'>A Stop hook blocked the first draft. Revising…</span>";
        var m2=msgs.concat([{role:"assistant",content:final},{role:"user",content:"STOP HOOK FEEDBACK. The reply you just wrote was blocked by the repo's Stop hook (.claude/hooks/decide-act.py). Fix every point below, then send the corrected reply only, with no mention of this message. Change only what the points below require. Keep every other line of your reply exactly as it was, word for word: same facts, same detail, same order. Do not shorten, summarise or rephrase anything the points do not name. The one exception: if the work you do to meet these points makes another line untrue (for example a line that says what you read, or what is left open), correct that line too, and change nothing else.\n\n"+chk.block+(chk.block.indexOf("L ITEMS OPEN")>-1?"\n\nNOTE FROM THIS VIEW: you cannot start sub-OODA loops or Agent calls here. Do not claim one is running. For each open L item: cite an existing DEC id only if it really is that founder decision; otherwise move it off the L list onto a line starting 'For a Claude Code session:' and add a 'Stopping because:' line saying the rest needs a real Claude Code session.":"")}]);
        var r0len=final.length;
        var r2=await callSample(m2,tools,bubble,"model call: revision after Stop hook");final=r2.text;r=r2;
        var chk2=await stopHooks(userMsg,final,true,turn);
        note="Stop hook blocked the first draft ("+chk.names.join(", ")+"); reply revised."+(chk2.block?" It was allowed through on the second pass (stop_hook_active), as in Claude Code.":"")+(chk2.audit?" Audit of the revision: "+chk2.audit+".":"")+" Length "+r0len+" → "+final.length+" chars.";
      }else note="Stop hook passed.";
      note+=" · "+H.stat();
    }
    bubble.innerHTML=md(final)+(r.truncated?'<div class="m note">Answer was cut off.</div>':"");
    if(note){var n=document.createElement("div");n.className="m note";n.textContent=note;$("msgs").appendChild(n)}
    history.push({role:"user",content:userMsg});history.push({role:"assistant",content:final});
    H.transcript.push({type:"user",message:{role:"user",content:userMsg}},{type:"assistant",message:{role:"assistant",content:[{type:"text",text:final}]}});
    turnSummary(turn,!!(note&&note.indexOf("blocked the first draft")>=0));
    endSpan(turn,final);
  }catch(e){
    endSpan(turn,undefined,"error",e);
    if(e&&e.code==="not_granted"){bubble.innerHTML="Claude access wasn't granted for this page.";}
    else if(e&&e.code==="rate_limited"){bubble.innerHTML="Rate limited. Try again in a bit.";}
    else bubble.innerHTML="Something went wrong"+(e&&e.message?": "+esc(e.message):".");
    dlog("ask failed: "+(e&&(e.code||e.name)||"")+" "+(e&&e.message||e));
  }
  CUR.turn=null;setBusy(false);
}
$("go").onclick=function(){ask($("in").value)};
$("in").onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask($("in").value)}};
var SUGG=["Give me an overview of this repo","How does the Unbound config work?","What do the Python scripts do?","What are the Claude Code hooks for?"];
$("chips").innerHTML=SUGG.map(function(s){return '<button>'+esc(s)+'</button>'}).join("");
$("chips").onclick=function(e){if(e.target.tagName==="BUTTON")ask(e.target.textContent)};

/* ---------- Python (Pyodide): tools/ checks, with a shim for subprocess/git ---------- */
var PY_BASE="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
var RUNNABLE=["check-cardinal","check-decisions","check-docs","check-doctrine","check-provenance","check-registers","check-statements","check-superfleet","check-stop-hook"];
var NOT_RUNNABLE=[["check-matrix","kills and caps real child processes to prove its limits; needs a real OS"],
  ["check-bridge","starts live child consoles and pipes; needs real processes"],
  ["check-telepathy","spawns a watcher process and uses inotify; needs a real OS"],

/* ---------- per-question summary (L-10): where the time went, what fired ---------- */
function descendants(root){var out=[],kids={};TRACE.forEach(function(s){(kids[s.parent]=kids[s.parent]||[]).push(s)});(function w(id){(kids[id]||[]).forEach(function(k){out.push(k);w(k.id)})})(root.id);return out}
function unionMs(spans){var iv=spans.filter(function(s){return s.end!=null}).map(function(s){return [s.start,s.end]}).sort(function(a,b){return a[0]-b[0]}),tot=0,cur=null;
  iv.forEach(function(x){if(!cur||x[0]>cur[1]){if(cur)tot+=cur[1]-cur[0];cur=[x[0],x[1]]}else cur[1]=Math.max(cur[1],x[1])});if(cur)tot+=cur[1]-cur[0];return tot}
function turnSummary(turn,revised){
  var d=descendants(turn),now=tnow();
  var models=d.filter(function(s){return s.kind==="model"}),tools=d.filter(function(s){return s.kind==="tool"}),hooksS=d.filter(function(s){return s.kind==="hook"}),stops=d.filter(function(s){return s.kind==="stop"});
  var modelMs=unionMs(models),toolMs=unionMs(tools),hookMs=hooksS.reduce(function(a,s){return a+(s.end!=null?s.end-s.start:0)},0),stopMs=unionMs(stops),totalMs=now-turn.start;
  var fired=[];hooksS.forEach(function(s){(s.steps||[]).forEach(function(x){if(x.k==="rule"&&String(x.x).indexOf("FIRED")===0)fired.push(x.w)})});
  var notChecked={};hooksS.forEach(function(s){(s.steps||[]).forEach(function(x){if(x.k==="rule"&&String(x.x).indexOf("not checked")===0)notChecked[x.w]=1})});
  var audit=d.filter(function(s){return s.kind==="audit"}).map(function(s){return s.meta.verdict})[0]||null;
  turn.meta.summary={total_ms:Math.round(totalMs),model_ms:Math.round(modelMs),tool_ms_inside_model:Math.round(toolMs),hook_ms:Math.round(hookMs),stop_ms:Math.round(stopMs),
    page_ms:Math.round(totalMs-modelMs-stopMs),tool_calls:tools.length,model_calls:models.length,revised:revised,rules_fired:fired,rules_not_checked_last_pass:Object.keys(notChecked),audit_of_revision:audit};
  turn.meta.summary_line=(totalMs/1000).toFixed(1)+" s = model "+(modelMs/1000).toFixed(1)+" s ("+tools.length+" tool calls, "+Math.round(toolMs)+" ms in tools) + Stop "+Math.round(stopMs)+" ms + page "+Math.round(totalMs-modelMs-stopMs)+" ms"+
    (revised?" · revised once":"")+(fired.length?" · fired: "+fired.join(", "):" · no rule fired")+(audit?" · audit: "+audit:"");
  dlog("turn summary: "+turn.meta.summary_line);
}

/* ---------- full trace viewer ---------- */
function pretty(v){if(v===undefined)return "";if(typeof v==="string")return v;try{return JSON.stringify(v,null,2)}catch(e){return String(v)}}
var SCOL={call:"#2563eb",return:"#6b7280",raise:"#b3261e",file:"#2e7d4f",rule:"#b45309",settings:"#7a5af8"};
function stepsHtml(s){
  if(!s.steps||!s.steps.length)return "";
  var t0=s.steps[0].t,n={call:0,file:0,rule:0,fired:0};
  s.steps.forEach(function(x){if(n[x.k]!==undefined)n[x.k]++;if(x.k==="rule"&&String(x.x).indexOf("FIRED")===0)n.fired++});
  var rows=s.steps.map(function(x){
    var col=x.k==="rule"&&String(x.x).indexOf("FIRED")===0?"#b3261e":(SCOL[x.k]||"inherit");
    return "<div class='st1' style='padding-left:"+(x.d*12)+"px'><span class='sk' style='color:"+col+"'>"+esc(x.k)+"</span> <b>"+esc(x.w)+"</b> <span class='sx'>"+esc(String(x.x))+"</span><span class='sm'>+"+(x.t-t0).toFixed(2)+"</span></div>"}).join("");
  return "<div class='tk'>runtime steps · "+n.call+" function calls · "+n.file+" file operations"+(n.rule?" · "+n.rule+" rules, "+n.fired+" fired":"")+"</div><div class='steps'>"+rows+"</div>";
}
function dur(s){return s.end==null?"running":(s.end-s.start<1?"<1":Math.round(s.end-s.start))+" ms"}
var KCOL={audit:"#0e7490",turn:"#7a5af8",model:"#c4552d",tool:"#2e7d4f",hook:"#2563eb",stop:"#b45309",session:"#6b7280"};
function renderTrace(){
  var v=$("fv");$("fh").textContent="Full trace · "+TRACE.length+" spans";tab("view");selected=null;renderTree();
  var kids={};TRACE.forEach(function(s){(kids[s.parent]=kids[s.parent]||[]).push(s)});
  var ids={};TRACE.forEach(function(s){ids[s.id]=1});
  var roots=TRACE.filter(function(s){return s.parent==null||!ids[s.parent]});
  function node(s,depth){
    var c=kids[s.id]||[],stat=s.status==="ok"?"":" · <b style='color:"+(s.status==="running"?"var(--mute)":"#b3261e")+"'>"+esc(s.status)+"</b>";
    var meta=Object.keys(s.meta||{}).length?"<div class='tk'>meta</div><pre>"+esc(pretty(s.meta))+"</pre>":"";
    var err=s.error?"<div class='tk'>error</div><pre>"+esc(s.error)+"</pre>":"";
    var sumline=s.meta&&s.meta.summary_line?"<div class='tk' style='width:100%;margin:2px 0 0'>"+esc(s.meta.summary_line)+"</div>":"";
    return "<details class='sp' style='margin-left:"+(depth?10:0)+"px;border-left:3px solid "+(KCOL[s.kind]||"#999")+"'"+(depth<1?" open":"")+"><summary><span class='kd' style='color:"+(KCOL[s.kind]||"#999")+"'>"+s.kind+"</span> "+esc(s.name)+"<span class='du'>"+dur(s)+stat+"</span>"+sumline+"</summary>"+
      "<div class='sb'><div class='tk'>started "+esc(s.wall.slice(11,23))+" · span "+s.id+(s.parent?" · parent "+s.parent:"")+"</div>"+meta+err+
      stepsHtml(s)+"<div class='tk'>input</div><pre>"+esc(pretty(s.input))+"</pre><div class='tk'>output</div><pre>"+esc(pretty(s.output))+"</pre></div>"+
      c.map(function(k){return node(k,depth+1)}).join("")+"</details>";
  }
  v.innerHTML="<div class='res'><h3>Full trace</h3><div class='st'>Everything this page sent to and got back from Claude, every tool call the model made, and every hook run. Inside each hook: the settings.json entry that started it, each function it called (named after the Python original), arguments and return values, each repo file it read, wrote or checked, and each Briefing rule with pass or FIRED. All with timings. Not visible from a page: the model's private reasoning, the server-side system prompt, and token counts (shown under meta only if the runtime returns them).</div>"+
   "<div style='display:flex;gap:8px;margin:8px 0'><button class='btn' id='tcopy'>Copy as JSON</button><button class='btn' id='tclear'>Clear</button></div>"+
   (roots.length?roots.map(function(r){return node(r,0)}).join(""):"<div class='empty'>No spans yet. Ask Claude something, then open this again.</div>")+"</div>";
  v.querySelector("#tcopy").onclick=function(){var b=this,PRE=H.preamble||"",TAG="<<PREAMBLE: the text in the top-level 'preamble' field>>";
    var t=JSON.stringify({page:location.origin,captured:new Date().toISOString(),preamble:PRE||null,spans:TRACE.map(function(s){return Object.assign({},s,{duration_ms:s.end==null?null:Math.round(s.end-s.start)})})},
      function(k,v){return (k!=="preamble"||this.spans===undefined)&&typeof v==="string"&&PRE&&v.length>=PRE.length&&v.indexOf(PRE)>=0?v.split(PRE).join(TAG):v},2);
    try{navigator.clipboard.writeText(t).then(function(){b.textContent="Copied "+Math.round(t.length/1024)+" KB"},function(){showRaw(t);b.textContent="Copy blocked: text shown below"})}catch(e){showRaw(t);b.textContent="Copy blocked: text shown below"}};
  v.querySelector("#tclear").onclick=function(){TRACE.length=0;renderTrace()};
  function showRaw(t){var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="width:100%;height:240px;font:11px ui-monospace,monospace";v.querySelector(".res").appendChild(ta);ta.focus();ta.select()}
}
