name: Publish statement gallery + Bifrost to Pages

# Makes the statement mockups (and the Bifrost notation page) openable by anyone
# at a first-party URL. GitHub serves .html files as source code, not rendered
# pages — so to "open" them in a browser we publish an assembled site as GitHub
# Pages. The statement gallery index lands at the site root
# (https://<owner>.github.io/<repo>/) and the Bifrost page at /bifrost.html.
#
# ONE-TIME SETUP (repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions"). After that, this workflow publishes on every push that
# touches the statements, and can be run by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/meta-audit-priorities-MzByf", "claude/inspiring-fermi-FIdYr"]
    paths:
      - "docs/statements/**"
      - "docs/bifrost.html"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Optional: regenerate the HTML from data/ so the published site is always
      # in sync with the generators. Safe to run — segno is the only dependency.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate statements
        run: |
          python -m pip install --quiet segno
          cd docs/statements
          python tools/generate_client.py
          python tools/generate_operator.py
      - uses: actions/configure-pages@v5
      - name: Assemble the Pages site (statement gallery at root + Bifrost)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a docs/statements/. _site/
          if [ -f docs/bifrost.html ]; then cp docs/bifrost.html _site/bifrost.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
