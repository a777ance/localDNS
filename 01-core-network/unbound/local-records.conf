# Deploys to: /etc/unbound/unbound.conf.d/local-records.conf
# Reload: sudo systemctl restart unbound
#
# LAN-only A records for the t630's own services, so the console sidebar and
# browser bookmarks can pin stable NAMES instead of brittle IP:port pairs.
# Every name here resolves to the t630 (192.168.1.118); the port is supplied by
# whoever opens the link (e.g. chat.home.lan:3000), not by DNS.
#
# WHY `transparent` (not `static` or `redirect`): a transparent local-zone
# overrides ONLY the exact names defined below. Any other name under home.lan
# falls through to normal resolution instead of being answered NXDOMAIN — so
# adding one pinned name never black-holes the rest of the zone. To pin another
# service, add a single `local-data` line; unlisted names keep resolving normally.
#
# These names are useful only on the LAN/VPN (they point at a private RFC1918
# address). They are not, and must not be, published to any public resolver.
#
# Verify after reload:
#   dig @127.0.0.1 -p 5335 console.home.lan +short   # -> 192.168.1.118
#   dig @127.0.0.1 -p 5335 chat.home.lan +short      # -> 192.168.1.118

server:
    local-zone: "home.lan." transparent

    # Service front doors on the t630 (192.168.1.118). Listed Z->A per house style.
    local-data: "term.home.lan.    IN A 192.168.1.118"   # ttyd web terminal (thin client), :7681
    local-data: "pihole.home.lan.  IN A 192.168.1.118"   # Pi-hole admin UI, :8080
    local-data: "laptop.home.lan.  IN A 192.168.1.118"   # ttyd web terminal (laptop via SSH jump), :7682
    local-data: "kuma.home.lan.    IN A 192.168.1.118"   # Uptime Kuma, :3001
    local-data: "console.home.lan. IN A 192.168.1.118"   # High-seat launcher, :8088
    local-data: "chat.home.lan.    IN A 192.168.1.118"   # Open WebUI (LLM chat), :3000
    local-data: "ai.home.lan.      IN A 192.168.1.118"   # LiteLLM router front door, :4040
