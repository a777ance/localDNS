# Deploys to: /etc/systemd/resolved.conf.d/host-dns.conf
# Reload: sudo systemctl restart systemd-resolved
#
# Why the t630 resolves its OWN DNS via external resolvers, not its own Pi-hole:
#
# Pi-hole runs with network_mode: host, so it binds 0.0.0.0:53 across every
# interface. Two facts make self-resolution unworkable:
#
#   1. Stub collision. systemd-resolved's stub listener owns 127.0.0.53:53, which
#      conflicts with Pi-hole's 0.0.0.0:53 bind. One has to yield the port — and
#      Pi-hole needs :53 to serve LAN + VPN clients — so the stub is disabled here
#      (DNSStubListener=no). Freeing :53 is what lets host-net Pi-hole start.
#   2. Unbound is on a non-standard port. Unbound answers on :5335, but
#      /etc/resolv.conf cannot carry a non-53 port, so the host can't point at
#      Unbound directly either.
#
# Left pointing at the (now-disabled) stub, the box cannot resolve anything for
# itself — apt, git and curl all fail with "Temporary failure in name resolution"
# even though the DNS service is healthy for every other device. Pointing the host
# at external resolvers decouples its own resolution from the Pi-hole/Unbound stack
# so it is never stranded while those services restart.
#
# Because disabling the stub removes the 127.0.0.53 listener that /etc/resolv.conf
# normally targets, the symlink must be re-pointed to the real-upstreams file:
#   sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
# (Field-guide DNS steps cover this.) Verify with a name not in /etc/hosts, e.g.
# `getent hosts security.ubuntu.com`, and confirm nothing else holds :53 before
# launching Pi-hole: `sudo ss -ulpn 'sport = :53'` (empty until Pi-hole starts).
#
# Trade: the box's own queries skip Pi-hole filtering — irrelevant on a headless
# server. See network-context.md "Host resolver" for the full analysis.
[Resolve]
DNS=9.9.9.9 1.1.1.1
DNSStubListener=no
