# Deploys to: /etc/wireguard/wg0.conf  (chmod 600)
# Reload: sudo systemctl restart wg-quick@wg0
# Add peer without restart: sudo wg set wg0 peer "PUBKEY" allowed-ips 10.8.0.X/32 && sudo wg-quick save wg0

[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = REPLACE_WITH_SERVER_PRIVATE_KEY
# 1420 = standard WireGuard MTU (1500 minus 60 bytes tunnel overhead).
# Without this, cellular paths drop oversized packets silently — breaking
# speed tests, Amazon, and any app that sends large UDP datagrams.
MTU = 1420

# MASQUERADE is in the nat table — PostUp is the right place for it and UFW
# does not touch the nat table.
#
# FORWARD *filtering* rules (ACCEPT/DROP) are intentionally absent here. Adding
# raw 'iptables -A FORWARD ... -j ACCEPT' rules alongside UFW caused silent chain
# conflicts: UFW owns the filter FORWARD chain, and manually appended ACCEPT rules
# get shadowed by UFW's own DROP policy. The correct fix is 'ufw default allow
# routed' in setup.sh (DEFAULT_FORWARD_POLICY=ACCEPT). Do NOT re-add
# '-i wg0 -o enp1s0 -j ACCEPT'-style filtering rules here.
#
# The one FORWARD rule in PostUp below is a deliberate exception: MSS clamping. It
# uses the TCPMSS target, which rewrites the SYN's MSS and RETURNs — it never
# ACCEPTs or DROPs, so it does not fight UFW's accept-routed policy. It forces TCP
# to negotiate segment sizes that fit the tunnel MTU, handling apps that ignore the
# MTU setting and send oversized SYNs. (If clamping ever seems not to take, verify
# the rule is actually traversed given where UFW ACCEPTs forwarded packets.)
PostUp = iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o enp1s0 -j MASQUERADE; iptables -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
PreDown = iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o enp1s0 -j MASQUERADE; iptables -D FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu

# IPv6: this tunnel is IPv4-only — wg0 has no IPv6 address and there is no
# ip6tables MASQUERADE here, so peers must NOT route ::/0 (it black-holes all
# IPv6: handshake succeeds, pages hang). The home has working IPv6, so full
# dual-stack is possible — see network-context.md "WireGuard IPv6 black hole"
# for the ULA + NAT66 setup. Until then, peers use AllowedIPs = 0.0.0.0/0.

[Peer]
# iPhone — added via WireGuard iOS (App Store)
PublicKey = REPLACE_WITH_PHONE_PUBLIC_KEY
AllowedIPs = 10.8.0.2/32

# [Peer]
# Mac peer — added via WireGuard macOS (App Store, NOT Homebrew)
# Uncomment the full block and fill in a real public key before deploying.
# An empty or placeholder [Peer] block causes wg-quick to fail at parse time.
# PublicKey = REPLACE_WITH_MAC_PUBLIC_KEY
# AllowedIPs = 10.8.0.7/32

# [Peer]
# Windows laptop — added via WireGuard for Windows (wireguard.com/install)
# The [Peer] header is commented too: a bare [Peer] with no PublicKey makes
# wg-quick fail at parse time. Uncomment the whole block (header included) once a
# real key is in place.
# KEY ROTATION REQUIRED: the private key for this peer was shared in plaintext
# during setup. Regenerate: on the laptop, delete the tunnel, create a new one,
# and re-add the new public key to this file via the derivation method below.
# !! Replace the placeholder below with a real key before deploying, or comment
# !! out the entire block. wg-quick fails to parse any invalid base64 PublicKey.
# PublicKey = REPLACE_WITH_LAPTOP_PUBLIC_KEY
# AllowedIPs = 10.8.0.3/32

# [Peer]
# UNIDENTIFIED (10.8.0.4) — present on the LIVE box with a real key but no recent
# handshake. Identify the device or remove the stale peer. The repo carries a
# commented placeholder only; real keys never live in git. Uncomment the whole
# block (header included) with a real key to represent it.
# PublicKey = REPLACE_WITH_PEER4_PUBLIC_KEY
# AllowedIPs = 10.8.0.4/32

# [Peer]
# UNIDENTIFIED (10.8.0.5) — see the 10.8.0.4 note.
# PublicKey = REPLACE_WITH_PEER5_PUBLIC_KEY
# AllowedIPs = 10.8.0.5/32

# [Peer]
# UNIDENTIFIED (10.8.0.6) — see the 10.8.0.4 note.
# PublicKey = REPLACE_WITH_PEER6_PUBLIC_KEY
# AllowedIPs = 10.8.0.6/32
